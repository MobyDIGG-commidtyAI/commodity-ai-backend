[project]
name = "commodity-ai-backend"
version = "0.1.0"
description = "Commodity AI API and price receipt dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "numpy==2.2.6",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.uv]
package = false
