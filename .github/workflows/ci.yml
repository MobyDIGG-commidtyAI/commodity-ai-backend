name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
      - run: docker build -t commodity-ai-backend .
